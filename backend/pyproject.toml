[project]
name = "deutschautocorrect"
version = "0.1.0"
description = "Correction automatique d'oraux d'allemand"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "anthropic>=0.40",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
pron = ["torch", "transformers", "soundfile"]
diar = ["pyannote.audio"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
